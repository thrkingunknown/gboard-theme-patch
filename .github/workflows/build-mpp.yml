name: Build Morphe Patch

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish v1.0.0 to GitHub Releases"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build and verify .mpp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Static source verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("patches/src/main/kotlin/dev/dva11/gboard/MidnightRedThemePatch.kt")
          s = p.read_text(encoding="utf-8")
          required = [
              'name = "Dva.11 Midnight Red Theme"',
              'packageName = PACKAGE_NAME',
              'AppTarget' not in s,
              'getContext()Landroid/content/Context;',
              'new-instance v12, Ljxq;',
              'invoke-direct {v12, v9, v10}, Ljxq;-><init>(Ljava/lang/String;Ljyj;)V',
              'invoke-interface {v5, v12}, Ljava/util/List;->add(Ljava/lang/Object;)Z',
              'val insertionIndex = instructions.lastIndex',
          ]
          assert all(required), required
          assert 'new-instance v12, Ljyj;' not in s
          assert 'invoke-static {p1, v11}' not in s
          assert 'definingClass = "Ljxu;"' not in s
          print("Static patch safety checks passed")
          PY

      - name: Clean previous outputs
        run: rm -rf patches/build

      - name: Build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon --stacktrace

      - name: Verify generated bundle
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(patches/build/libs/*.mpp)
          test "${#files[@]}" -eq 1
          file="${files[0]}"
          unzip -t "$file"
          python - "$file" <<'PY'
          import sys, zipfile
          from pathlib import Path
          p = Path(sys.argv[1])
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
              assert any(n.endswith(".dex") for n in names), "MPP has no compiled DEX"
              assert any(n.endswith(".json") for n in names), "MPP has no patch metadata"
          print(f"Verified: {p.name}")
          PY
          sha256sum "$file" | tee patches/build/libs/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dva11-Gboard-Midnight-Red-v1.0.0
          path: |
            patches/build/libs/*.mpp
            patches/build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish v1.0.0 release
        if: ${{ inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(patches/build/libs/*.mpp)
          test "${#files[@]}" -eq 1
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 \
            --title "Dva.11 Gboard Midnight Red v1.0.0" \
            --notes "Standalone Gboard Midnight Red Morphe patch."
          gh release upload v1.0.0 "${files[0]}" patches/build/libs/SHA256SUMS.txt --clobber
