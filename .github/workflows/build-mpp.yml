name: Build Morphe Patch

on:
  workflow_dispatch:
    inputs:
      publish_to_releases:
        description: Publish to releases
        required: true
        default: false
        type: boolean
      version:
        description: Version (for example 1.0.0 or 1.0.0-beta.1)
        required: true
        default: 1.0.0
        type: string
      release_type:
        description: Release type
        required: true
        default: release
        type: choice
        options:
          - release
          - pre-release

permissions:
  contents: write
  packages: read

concurrency:
  group: gboard-amoled-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify .mpp
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.4'

      - name: Validate inputs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid version: $VERSION"
            exit 1
          }
          [[ "$RELEASE_TYPE" == "release" || "$RELEASE_TYPE" == "pre-release" ]] || {
            echo "Invalid release type: $RELEASE_TYPE"
            exit 1
          }

      - name: Static source verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          s = Path("patches/src/main/kotlin/dev/dva11/gboard/MidnightRedThemePatch.kt").read_text()
          b = Path("patches/build.gradle.kts").read_text()

          required = [
              'definingClass = "Lcom/google/android/apps/inputmethod/libs/theme/listing/ThemeListingFragment;"',
              'parameters = listOf("Landroid/os/Bundle;")',
              'themeListing',
              'implementation?.instructions',
              'addInstructions(',
              'Landroidx/fragment/app/Fragment;->getContext()Landroid/content/Context;',
              'new-instance v12, Ljxq;',
              'invoke-direct {v12, v10, v11}, Ljxq;-><init>(Ljava/lang/String;Ljyj;)V',
              'stringOption(name = "Background',
              'Additional themes:',
          ]
          for item in required:
              assert item in s, item

          assert 'AppTarget(' not in s
          assert 'Ljxu;' not in s
          assert 'new-instance v12, Ljyj;' not in s
          assert 'anchor.index' not in s
          assert 'anchor.index + 1' not in s
          assert 'contact = "https://github.com/thrkingunknown"' in b
          assert 'name = "Gboard AMOLED Themes"' in b
          print("Static verification passed")
          PY

      - name: Static source verification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_source.py

      - name: Build configuration verification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_build_config.py

      - name: Build .mpp
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gradle buildAndroid -Pversion="$VERSION" --no-daemon --stacktrace

      - name: Verify .mpp
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(patches/build/libs/*.mpp)
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "Expected exactly one .mpp, found ${#files[@]}"
            find patches/build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi

          mpp="${files[0]}"
          expected="patches-${VERSION}.mpp"
          if [[ "$(basename "$mpp")" != "$expected" ]]; then
            echo "Expected $expected but got $(basename "$mpp")"
            exit 1
          fi

          unzip -t "$mpp"
          sha256sum "$mpp" > patches/build/libs/SHA256SUMS.txt
          printf 'MPP=%s\n' "$mpp" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Gboard-AMOLED-Themes-${{ inputs.version }}
          path: |
            patches/build/libs/*.mpp
            patches/build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish to releases
        if: ${{ inputs.publish_to_releases }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          MPP: ${{ env.MPP }}
        shell: bash
        run: |
          set -euo pipefail

          tag="v${VERSION}"
          title="Gboard AMOLED Themes v${VERSION}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release/tag $tag already exists. Refusing to overwrite it."
            exit 1
          fi

          if [[ "$RELEASE_TYPE" == "pre-release" ]]; then
            gh release create "$tag" "$MPP" patches/build/libs/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --generate-notes \
              --prerelease
          else
            gh release create "$tag" "$MPP" patches/build/libs/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --generate-notes
          fi
