name: Build Morphe Patch

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build and verify .mpp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle buildAndroid --no-daemon --stacktrace

      - name: Verify .mpp
        shell: bash
        run: |
          shopt -s nullglob
          files=(patches/build/libs/*.mpp)
          test "${#files[@]}" -eq 1
          unzip -t "${files[0]}"
          sha256sum "${files[0]}" > patches/build/libs/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Gboard-Midnight-Red-Morphe-Patch-${{ github.run_number }}
          path: |
            patches/build/libs/*.mpp
            patches/build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
