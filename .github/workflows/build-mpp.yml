name: Build Morphe Patch

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build and verify .mpp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Static bytecode-source verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("patches/src/main/kotlin/dev/dva11/gboard/MidnightRedThemePatch.kt")
          s = p.read_text()
          required = [
              'new-instance v12, Ljxq;',
              'invoke-static {p1, v11}, Ljyj;->e(Landroid/content/Context;Lqyk;)Ljyj;',
              'invoke-direct {v12, v9, v11}, Ljxq;-><init>(Ljava/lang/String;Ljyj;)V',
              'invoke-interface {v5, v12}, Ljava/util/List;->add(Ljava/lang/Object;)Z',
              'definingClass = "Ljxu;"',
              'anchor.index,',
          ]
          for item in required:
              assert item in s, item
          assert 'new-instance v12, Ljyj;' not in s
          assert 'anchor.index + 1' not in s
          print("Static injection verification passed")
          PY

      - name: Build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle buildAndroid --no-daemon --stacktrace

      - name: Verify .mpp
        shell: bash
        run: |
          shopt -s nullglob
          files=(patches/build/libs/*.mpp)
          test "${#files[@]}" -eq 1
          unzip -t "${files[0]}"
          sha256sum "${files[0]}" > patches/build/libs/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Gboard-Midnight-Red-Morphe-Patch-${{ github.run_number }}
          path: |
            patches/build/libs/*.mpp
            patches/build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
