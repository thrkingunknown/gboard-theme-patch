name: Release

on:
  workflow_dispatch:
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    # semantic-release is configured for main and dev only.
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Suppress Git default-branch advice
        run: git config --global advice.defaultBranchName false

      - name: Setup Gradle for wrapper bootstrap
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
          cache-read-only: false

      - name: Bootstrap pinned Morphe toolchain
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          rm -rf .gradle-deps
          mkdir -p .gradle-deps

          clone_tag() {
            local repo="$1"
            local first_tag="$2"
            local second_tag="$3"
            local destination="$4"
            if git ls-remote --exit-code --tags "https://github.com/${repo}.git" "refs/tags/${first_tag}" >/dev/null 2>&1; then
              git clone --depth 1 --branch "${first_tag}" "https://github.com/${repo}.git" "${destination}"
            else
              git clone --depth 1 --branch "${second_tag}" "https://github.com/${repo}.git" "${destination}"
            fi
          }

          # The plugin source is included as a Gradle composite build. This avoids
          # authenticated GitHub Packages plugin resolution completely.
          clone_tag MorpheApp/morphe-patches-gradle-plugin v1.3.4 1.3.4 .gradle-deps/morphe-patches-gradle-plugin

          # Patcher is published into the local Maven repository because the Morphe
          # settings plugin adds it to the patch module's dependency graph.
          clone_tag MorpheApp/morphe-patcher v1.13.0 1.13.0 .gradle-deps/morphe-patcher

          test -f .gradle-deps/morphe-patches-gradle-plugin/gradlew
          test -f .gradle-deps/morphe-patches-gradle-plugin/gradle/wrapper/gradle-wrapper.jar
          test -f .gradle-deps/morphe-patcher/gradlew
          test -f .gradle-deps/morphe-patcher/gradle/wrapper/gradle-wrapper.jar

          chmod +x .gradle-deps/morphe-patches-gradle-plugin/gradlew
          chmod +x .gradle-deps/morphe-patcher/gradlew

          # Build/publish Patcher using its own wrapper BEFORE the root project is evaluated.
          (cd .gradle-deps/morphe-patcher && ./gradlew publishToMavenLocal --no-daemon --stacktrace)

          # The root wrapper bootstrap must never invoke the root settings script: that
          # script needs the local Morphe plugin source above. Reuse the pinned Patcher
          # wrapper JAR and keep the root distribution pinned to 9.7.1.
          cp .gradle-deps/morphe-patcher/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

          test -f gradle/wrapper/gradle-wrapper.jar
          test -f "$HOME/.m2/repository/app/morphe/morphe-patcher/1.13.0/morphe-patcher-1.13.0.jar"
          echo "Pinned Morphe plugin source and Patcher are ready"

      - name: Ensure Morphe dev branch exists
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then
            echo "origin/dev already exists"
          else
            echo "origin/dev is missing; creating it from the current commit"
            git push origin HEAD:refs/heads/dev
          fi

      - name: Verify CI, release, and cache configuration
        run: python3 .github/scripts/verify_ci_config.py

      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Verify the exact public metadata and release asset that Morphe Manager will consume.
      # This catches broken/partial releases before the workflow is considered successful.
      - name: Verify published Morphe metadata
        if: steps.release.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.release.outputs.new_release_version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          META_URL="https://raw.githubusercontent.com/${REPOSITORY}/refs/heads/main/patches-bundle.json"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$META_URL" -o /tmp/patches-bundle.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ['VERSION']
          bundle = json.loads(Path('/tmp/patches-bundle.json').read_text())
          expected = f"https://github.com/{os.environ['REPOSITORY']}/releases/download/v{version}/patches-{version}.mpp"
          assert bundle['version'] == version, (bundle['version'], version)
          assert bundle['download_url'] == expected, (bundle['download_url'], expected)
          print(f"Published metadata verified: v{version}")
          PY
          DOWNLOAD_URL="https://github.com/${REPOSITORY}/releases/download/v${VERSION}/patches-${VERSION}.mpp"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 -o /dev/null "$DOWNLOAD_URL"
          echo "Published MPP verified: $DOWNLOAD_URL"

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon --build-cache
