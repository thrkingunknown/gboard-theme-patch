name: Release

on:
  workflow_dispatch:
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    # semantic-release is configured for main and dev only.
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Gradle for wrapper bootstrap
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
          cache-read-only: false

      - name: Ensure Gradle wrapper is present
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.7.1
          fi
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      # The Morphe template expects a permanent dev branch for prereleases and
      # back-merging stable releases. Create it automatically for repositories
      # that were created without the template's second branch.
      - name: Ensure Morphe dev branch exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then
            echo "origin/dev already exists"
          else
            echo "origin/dev is missing; creating it from the current commit"
            git push origin HEAD:refs/heads/dev
          fi

      # The Morphe template uses semantic-release to build and publish the MPP.
      - name: Verify CI, release, and cache configuration
        run: python3 .github/scripts/verify_ci_config.py

      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release creates the release commit and tag, but the historical
      # repository state can leave the branch ref one commit behind the tag.
      # Morphe Manager reads metadata from the repository default branch, so
      # make the release commit reachable from the active release branch.
      - name: Sync release metadata to release branch
        if: steps.release.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.release.outputs.new_release_version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" --tags
          TAG="v${VERSION}"
          if git merge-base --is-ancestor "origin/${BRANCH}" "${TAG}"; then
            git push origin "refs/tags/${TAG}:refs/heads/${BRANCH}"
            echo "${BRANCH} fast-forwarded to ${TAG}; release metadata is now on the branch."
          elif git merge-base --is-ancestor "${TAG}" "origin/${BRANCH}"; then
            echo "${BRANCH} already contains ${TAG}; no branch update required."
          else
            echo "ERROR: ${BRANCH} and ${TAG} have diverged; refusing a force push."
            exit 1
          fi

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Verify compilation when no release was produced (docs/chore/non-release branches).
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon --build-cache
